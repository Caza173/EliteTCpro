<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#050506" />
  <title>EliteTC — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050506;
      color: #f7f3ea;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(210, 163, 95, 0.12);
      border: 1px solid rgba(210, 163, 95, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
      font-weight: 800;
      color: #d2a35f;
      font-style: italic;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f7f3ea;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #a7adba;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
    }
    button {
      background: rgba(210, 163, 95, 0.12);
      color: #d2a35f;
      border: 1px solid rgba(210, 163, 95, 0.35);
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background: rgba(210, 163, 95, 0.2);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d2a35f;
      animation: pulse 1.5s ease-in-out infinite;
      display: inline-block;
      margin: 0 3px;
    }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }
    .dots { margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="logo">E</div>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <h1>You're offline</h1>
  <p>EliteTC requires an internet connection to securely access your transaction data. Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
